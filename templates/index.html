<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#222222">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="/static/main.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Todoアプリ</h1>

        <!-- タスク一覧 -->
        <div class="flex-container">
            <h2>未分類のタスク</h2>
            <button type="button" id="unclassified-add-task" class="add-btn">+</button>
        </div>
        <ul id="taskList"></ul>
        



        <!--朝のグループ-->
        <div class="time-group morning-group">
            <div class="flex-container">
                <h2 id="morning">朝(8:00-12:00)</h2>
                <button type="button" id="morning-add-task" class="add-btn">+</button>
            </div>
            <ul id="morningList"></ul>
        </div>

        <!--昼のグループ-->
        <div class="time-group afternoon-group">
            <div class="flex-container">
                <h2 id="afternoon">昼(12:00-18:00)</h2>
                <button type="button" id="afternoon-add-task" class="add-btn">+</button>
            </div>
            <ul id="afternoonList"></ul>
        </div>

        <!--夜のグループ-->
        <div class="time-group night-group">
            <div class="flex-container">
                <h2 id="night">夜(18:00-24:00)</h2>
                <button type="button" id="night-add-task" class="add-btn">+</button>
            </div>
            <ul id="nightList"></ul>
        </div>

        <h2>完了したタスク</h2>
        <ul id="doneList"></ul>
    </div>

    <!-- 右下固定のFAB (Floating Action Button) -->
    <button id="fab-add-task" class="fab">+</button>

    <!-- ボトムシート (追加・編集用ポップアップ) -->
    <div id="bottom-sheet-overlay" class="bottom-sheet-overlay"></div>
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="bottom-sheet-handle"></div>
        <form id="sheet-form">
            <input type="hidden" id="sheet-task-id">
            <input type="text" id="sheet-title" placeholder="やることを入力" required autocomplete="off">
            <textarea id="sheet-description" placeholder="詳細説明（任意）" rows="3"></textarea>
            
            <div class="sheet-slot-selector">
                <label><input type="radio" name="sheet-slot" value="未分類" checked><span>未分類</span></label>
                <label><input type="radio" name="sheet-slot" value="朝"><span>朝</span></label>
                <label><input type="radio" name="sheet-slot" value="昼"><span>昼</span></label>
                <label><input type="radio" name="sheet-slot" value="夜"><span>夜</span></label>
            </div>
            
            <button type="submit" id="sheet-submit-btn" class="sheet-submit-btn">↑</button>
        </form>
    </div>
</body>
</html>
