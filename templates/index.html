<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/main.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Todoアプリ</h1>

        <!-- タスク追加フォーム -->
        <form id="add-form">
            <input type="text" id="title" name="title" placeholder="やることを入力" required>
            <button type="submit" id="add-button">Add</button>
        </form>

        <!-- タスク一覧 -->
        <h2>未分類のタスク</h2>
        <ul id="taskList"></ul>



        <!-- スクロール先 -->
        <h2 id="morning">朝(8:00-12:00)</h2>
        <ul id="morningList"></ul>
        <h2 id="afternoon">昼(12:00-18:00)</h2>
        <ul id="afternoonList"></ul>
        <h2 id="night">夜(18:00-24:00)</h2>
        <ul id="nightList"></ul>

        <h2>完了したタスク</h2>
        <ul id="doneList"></ul>

        </ul>
    </div>

</body>
</html>
